[project]
name = "macroscope"
version = "0.1.0"
description = "Macroscope — advisory macro thesis engine (design-doc v0.1)"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "sqlalchemy>=2.0",
    "psycopg2-binary",
    "pydantic>=2",
    "requests",
    "python-dotenv",
    "yfinance",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["macroscope*", "ingestion*", "storage*", "signals*", "reporting*", "backtest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
